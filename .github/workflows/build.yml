name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

env:
  PNPM_VERSION: 8.15.9
  PRISMA_CLI_BINARY_TARGETS: linux-musl-openssl-3.0.x
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  checks:
    name: Lint, typecheck and token-free tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: tags
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: tags_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tags -d tags_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The Ubuntu check runner needs glibc engines, not the Alpine image target.
      PRISMA_CLI_BINARY_TARGETS: debian-openssl-3.0.x
      DATABASE_URL: postgresql://tags:local-test-only@localhost:5432/tags_test
      TAGS_TEST_DATABASE_URL: postgresql://tags:local-test-only@localhost:5432/tags_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma db push
      - run: pnpm test

  image:
    name: Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PNPM_VERSION=${{ env.PNPM_VERSION }}
            PRISMA_CLI_BINARY_TARGETS=${{ env.PRISMA_CLI_BINARY_TARGETS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
